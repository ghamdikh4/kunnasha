<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كُنّاشة الفوائد</title>
<meta name="theme-color" content="#14323f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كُنّاشة">
<meta name="description" content="كُنّاشة رقمية للفوائد العلمية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e6; --paper2:#fffdf8; --ink:#1d2b36; --muted:#6b7b85;
  --navy:#14323f; --navy2:#1d4455; --gold:#b08d57; --gold-soft:#e8dcc4;
  --line:#e3dac7; --ok:#2e7d58; --warn:#9a6b1f; --danger:#9b3b32;
  --shadow:0 1px 2px rgba(20,50,63,.06),0 8px 24px rgba(20,50,63,.07);
  --r:16px; --fs:16px;
}
html[data-theme="dark"]{
  --paper:#11191e; --paper2:#18232a; --ink:#e9e3d6; --muted:#9aa9b2;
  --navy:#9fd0cf; --navy2:#cfe5e4; --gold:#d8b87c; --gold-soft:#2b3a42;
  --line:#2a3942; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Cairo",system-ui,"Segoe UI",sans-serif;
  background:var(--paper); color:var(--ink); font-size:var(--fs);
  line-height:1.8; -webkit-text-size-adjust:100%;
  background-image:radial-gradient(rgba(176,141,87,.07) 1px,transparent 1px);
  background-size:22px 22px;
  padding-bottom:96px;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--navy)}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);
  color:#f6f1e6;box-shadow:var(--shadow)
}
html[data-theme="dark"] header{background:linear-gradient(180deg,#0e171c,#152027);color:var(--ink)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-family:"Amiri",serif;font-size:1.45rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand span{color:var(--gold)}
.hd .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);color:inherit;font-size:1.05rem}
html[data-theme="dark"] .iconbtn{background:rgba(255,255,255,.06)}
.iconbtn:active{transform:scale(.94)}
.modepill{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--gold);color:#1d2b36;font-weight:700}
.modepill.guest{background:rgba(255,255,255,.18);color:inherit}

.searchrow{display:flex;gap:8px;padding:0 0 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper2);
  border-radius:12px;padding:8px 12px;color:var(--ink)}
.search input{flex:1;border:none;outline:none;background:transparent;min-width:0}

/* ===== Tabs ===== */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 14px;border-radius:999px;font-size:.86rem;
  background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.tab.on{background:var(--navy);color:#f6f1e6;border-color:var(--navy);font-weight:600}
html[data-theme="dark"] .tab.on{background:var(--gold);color:#11191e}

/* ===== Filters ===== */
.filters{margin-top:10px;background:var(--paper2);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;display:none}
.filters.open{display:block}
.frow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.frow:last-child{margin-bottom:0}
.flabel{font-size:.78rem;color:var(--muted);min-width:52px}
.chip{font-size:.8rem;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--ink);font-weight:600}
html[data-theme="dark"] .chip.on{color:var(--gold)}
.countline{font-size:.8rem;color:var(--muted);padding:12px 2px 6px;display:flex;gap:10px;align-items:center}

/* ===== Cards ===== */
.cards{display:grid;gap:12px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold);opacity:.55}
.card.private::before{background:var(--navy)}
.card.draft::before{background:var(--warn)}
.ctop{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:.7rem;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
html[data-theme="dark"] .badge{color:var(--gold)}
.badge.priv{background:transparent;border:1px solid var(--navy);color:var(--navy)}
.badge.draft{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.star{margin-inline-start:auto;color:var(--gold);font-size:1.05rem;opacity:.3}
.star.on{opacity:1}
.ctitle{font-weight:700;font-size:.98rem;margin:0 0 4px}
.ctext{font-family:"Amiri",serif;font-size:1.22rem;line-height:2;margin:0;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card.full .ctext{-webkit-line-clamp:unset;display:block}
.cite{margin-top:10px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.cite b{color:var(--ink);font-weight:600}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;color:var(--muted);background:transparent;border:1px solid var(--line);
  padding:1px 8px;border-radius:999px}
.cacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sbtn{font-size:.78rem;padding:5px 11px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.sbtn:hover{border-color:var(--gold);color:var(--ink)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:2.4rem;opacity:.35}

/* ===== FAB ===== */
.fab{position:fixed;inset-inline-end:18px;bottom:22px;z-index:50;
  background:var(--navy);color:#f6f1e6;border-radius:999px;padding:14px 20px;
  font-weight:700;box-shadow:0 10px 26px rgba(20,50,63,.3);display:flex;gap:8px;align-items:center}
html[data-theme="dark"] .fab{background:var(--gold);color:#11191e}
.fab:active{transform:scale(.96)}

/* ===== Sheet / modal ===== */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:60;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.scrim.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:16px 16px 28px;animation:up .22s ease}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.shhd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shhd h3{margin:0;font-size:1.05rem}
.shhd .sp{flex:1}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input.t,select.t,textarea.t{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper2);outline:none}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--gold)}
textarea.main{font-family:"Amiri",serif;font-size:1.25rem;line-height:2;min-height:150px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}
details.more summary{cursor:pointer;font-size:.88rem;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px;color:var(--ink);font-weight:600}
.btn{padding:12px 18px;border-radius:12px;font-weight:700;background:var(--navy);color:#f6f1e6;width:100%}
html[data-theme="dark"] .btn{background:var(--gold);color:#11191e}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.row2{display:flex;gap:8px}
.hint{font-size:.76rem;color:var(--muted);line-height:1.7}
.hint code{background:var(--gold-soft);padding:1px 5px;border-radius:5px;font-family:inherit}
html[data-theme="dark"] .hint code{color:var(--gold)}

/* detail */
.dtext{font-family:"Amiri",serif;font-size:1.35rem;line-height:2.2;white-space:pre-wrap}
.meta{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:.9rem}
.meta div{margin-bottom:5px}
.meta b{color:var(--muted);font-weight:600;margin-inline-end:6px}
.quote{background:var(--gold-soft);border-radius:12px;padding:12px;margin-top:12px;
  font-size:.86rem;white-space:pre-wrap;font-family:"Amiri",serif}
html[data-theme="dark"] .quote{background:#20303a}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat .n{font-size:1.7rem;font-weight:700;color:var(--navy);font-family:"Amiri",serif}
html[data-theme="dark"] .stat .n{color:var(--gold)}
.stat .l{font-size:.78rem;color:var(--muted)}
.bars{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.bars h4{margin:0 0 10px;font-size:.92rem}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:.84rem}
.bar .nm{width:35%;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:9px;background:var(--gold-soft);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;background:var(--gold);border-radius:999px}
.bar .vl{width:28px;text-align:center;color:var(--muted)}

/* toast */
.toast{position:fixed;inset-inline:0;bottom:92px;z-index:70;display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--navy);color:#f6f1e6;padding:10px 16px;border-radius:999px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:.88rem;pointer-events:auto;
  animation:up .2s ease}
html[data-theme="dark"] .toast div{background:var(--gold);color:#11191e}
.toast button{font-weight:700;text-decoration:underline;color:inherit}
.loading{position:fixed;inset:0;background:rgba(246,241,230,.75);z-index:90;display:none;
  place-items:center;font-weight:600;backdrop-filter:blur(2px)}
html[data-theme="dark"] .loading{background:rgba(17,25,30,.8)}
.loading.on{display:grid}
.banner{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:1px solid var(--gold);
  border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.84rem}
html[data-theme="dark"] .banner{color:var(--gold)}
.banner .sp{flex:1}
.banner button{font-size:.78rem;padding:3px 10px;border-radius:9px;border:1px solid var(--gold);color:inherit}
.card.pending{opacity:.75}
.card.pending::before{background:var(--muted)}
.badge.wait{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.demo{font-size:.76rem;text-align:center;color:var(--muted);padding:14px 10px 0}
.listsec{font-family:"Amiri",serif;font-size:1.05rem;color:var(--navy);margin:16px 2px 2px;font-weight:700}
html[data-theme="dark"] .listsec{color:var(--gold)}
.pbtn{display:block;width:100%;text-align:right;background:var(--paper2);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pbtn small{color:var(--muted);margin-inline-start:auto}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">كُنّاشة <span>الفوائد</span></div>
      <span class="modepill guest" id="modePill">زائر</span>
      <div class="sp"></div>
      <button class="iconbtn" id="btnTheme" title="الوضع الليلي">◐</button>
      <button class="iconbtn" id="btnFont" title="حجم الخط">أ</button>
      <button class="iconbtn" id="btnHelp" title="دليل الاستعمال">؟</button>
      <button class="iconbtn" id="btnPrint" title="كُنّاشة مطبوعة">🖨</button>
      <button class="iconbtn" id="btnSession" title="جلسة قراءة" style="display:none">📖</button>
      <button class="iconbtn" id="btnAuth" title="دخول">⌸</button>
    </div>
    <div class="searchrow">
      <div class="search">
        <span>🔍</span>
        <input id="q" placeholder="ابحث في النص والقائل والمرجع والوسوم…" autocomplete="off">
        <button id="qclear" style="color:var(--muted);display:none">✕</button>
      </div>
      <button class="iconbtn" id="btnFilters" title="تصفية">⚙</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <div class="filters" id="filters"></div>
  <div class="countline" id="countline"></div>
  <div id="view"></div>
  <p class="demo" id="demoNote">فوائدك محفوظة في جدول Google الخاص بك. «قيّدوا العلمَ بالكتاب».</p>
</main>

<button class="fab" id="fab" style="display:none">＋ <span>فائدة</span></button>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">جارٍ الحفظ…</div>

<script>
/* ============================================================
   كُنّاشة الفوائد — المرحلة 1 (نموذج أولي)
   طبقة البيانات db.*  منفصلة تمامًا عن الواجهة.
   في المرحلة 3 لا يُغيَّر إلا محتوى دوال db.*  لتتصل بـ Apps Script.
   ============================================================ */

/* ---------- 1) طبقة البيانات — متصلة بخادم Google Apps Script ----------
   هذا هو الجزء الوحيد الذي تغيّر عن المرحلة 1. بقية الصفحة كما هي.
   ضع رابط الخادم في السطر التالي (المنتهي بـ /exec)، أو اتركه فارغًا
   فتطلبه المنصة منك مرة واحدة عند أول فتح وتحفظه في جهازك.          */

const SERVER_URL = '';   // ◀◀◀ مثال: 'https://script.google.com/macros/s/AKfy..../exec'

const SRV='k_server', TOK='k_token';
function srv(){ return (SERVER_URL||'').trim() || (localStorage.getItem(SRV)||'').trim(); }
function setSrv(u){ try{localStorage.setItem(SRV,u.trim())}catch(e){} }
function tok(){ try{return localStorage.getItem(TOK)||''}catch(e){return ''} }
function setTok(t){ try{ t?localStorage.setItem(TOK,t):localStorage.removeItem(TOK) }catch(e){} }

async function api(fn,args){
  const url=srv();
  if(!url) throw new Error('لم يُضبط رابط الخادم بعد');
  let res;
  try{
    res = await fetch(url,{ method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:tok(), fn:fn, args:args||{}}) });
  }catch(e){ throw new Error('تعذّر الاتصال بالخادم — تحقّق من الإنترنت ومن رابط الخادم'); }
  const txt = await res.text();
  let j; try{ j=JSON.parse(txt) }catch(e){
    throw new Error('رد غير متوقّع من الخادم — غالبًا رابط النشر خاطئ أو الوصول ليس «أي شخص»');
  }
  if(!j.ok){
    if(j.auth){ setTok(''); st.owner=false; }
    throw new Error(j.error||'خطأ في الخادم');
  }
  return j.data;
}

const db = {
  async init(){ return !!srv(); },

  async settings(){
    const s = await api('settings');
    return { name:s['اسم المنصة']||'كُنّاشة الفوائد',
             desc:s['الوصف']||'',
             perPage:Number(s['عدد الفوائد في الصفحة']||20)||20,
             defaultVisibility:s['الظهور الافتراضي']||'خاصة' };
  },

  async meta(){ return await api(st.owner?'meta':'metaPublic'); },

  async list(owner){ return await api(owner?'list':'listPublic'); },
  async trash(){ return await api('trash'); },
  async get(id,owner){ return await api(owner?'get':'getPublic',{id}); },

  async save(obj){ const r = await api('save',{item:obj}); return r.id; },
  async setField(id,field,value){ return await api('setField',{id,field,value}); },
  async remove(id){ return await api('remove',{id}); },
  async restore(id){ return await api('restore',{id}); },
  async purge(id){ return await api('purge',{id}); },
  async addMeta(kind,value){ return await api('addMeta',{kind,value}); },
  async metaCounts(){ return await api('metaCounts'); },
  async due(){ return await api('due'); },
  async review(id,grade){ return await api('review',{id,grade}); },
  async series(){ return await api('series'); },
  async reading(){ return await api('reading'); },
  async renameMeta(kind,from,to){ return await api('renameMeta',{kind,from,to}); },
  async mergeMeta(kind,from,to){ return await api('mergeMeta',{kind,from,to}); },
  async deleteMeta(kind,value){ return await api('deleteMeta',{kind,value}); },
  async saveSettings(settings){ return await api('saveSettings',{settings}); },
  async emptyTrash(){ return await api('emptyTrash'); },
  async changePassword(oldPw,newPw){ return await api('changePassword',{old:oldPw,neu:newPw}); },
  async exportAll(){ return JSON.stringify(await api('exportAll'),null,2); },

  async login(password){
    const r = await api('login',{password});
    if(r && r.ok && r.token){ setTok(r.token); return true; }
    return false;
  },
  async checkToken(){ if(!tok()) return false; try{ await api('checkToken'); return true; }catch(e){ return false; } },
  async logout(){ try{ await api('logout'); }catch(e){} setTok(''); }
};

/* ---------- 3) أدوات ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){ return (s||'')
  .replace(/[ً-ْٰـ]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/[ىئ]/g,'ي').replace(/ؤ/g,'و')
  .replace(/\s+/g,' ').trim().toLowerCase(); }
function hijri(iso){
  try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso)); }
  catch(e){ return ''; }
}
function greg(iso){ try{return new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso))}catch(e){return ''} }
function toast(msg,actionLabel,action){
  const t=$('#toast'); t.innerHTML='';
  const b=el('div',null,esc(msg));
  if(actionLabel){const a=el('button',null,esc(actionLabel));a.onclick=()=>{t.innerHTML='';action&&action()};b.appendChild(a);}
  t.appendChild(b); clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML='',5000);
}
function busy(on,msg){ const l=$('#loading'); if(msg) l.textContent=msg; l.classList.toggle('on',!!on); }

/* ---------- 4) الحالة ---------- */
const st={ owner:false, tab:'all', q:'', f:{cat:'',speaker:'',ref:'',type:'',tag:''},
           limit:20, meta:null, items:[], settings:null, session:null, queue:[] };

/* ---------- 5) الإقلاع ---------- */
(async function(){
  document.documentElement.dataset.theme = localStorage.getItem('k_theme')||'light';
  document.documentElement.style.setProperty('--fs',(localStorage.getItem('k_fs')||16)+'px');
  loadSession(); loadQueue();
  bindChrome();
  if(!srv()){ serverSheet(); return; }          // أول فتح: اطلب رابط الخادم
  busy(true,'جارٍ الاتصال بالخادم…');
  try{
    st.owner = await db.checkToken();
    st.settings = await db.settings();
    applySettings();
    busy(false);
    await refresh();
    flushQueue(false);
    handleHash();
    restoreDraftNotice();
  }catch(e){
    busy(false);
    fatal(e.message);
  }
})();

/** شاشة إدخال رابط الخادم (تظهر مرة واحدة في كل جهاز) */
function serverSheet(){
  openSheet(`<div class="shhd"><h3>ربط الكُنّاشة بخادمك</h3></div>
    <p class="hint">الصق رابط تطبيق الويب الذي نسخته من Apps Script (ينتهي بـ <code>/exec</code>). يُحفظ في هذا الجهاز فقط، ويُطلب مرة واحدة.</p>
    <label class="fld"><span>رابط الخادم</span>
      <input class="t" id="srvin" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(srv())}"></label>
    <button class="btn" id="srvgo">اتصال</button>
    <p class="hint" id="srvmsg" style="margin-top:10px"></p>`);
  $('#srvin').focus();
  $('#srvgo').onclick=async()=>{
    const u=$('#srvin').value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){
      $('#srvmsg').innerHTML='<span style="color:var(--danger)">الرابط غير صحيح — يبدأ بـ https://script.google.com ‏وينتهي بـ /exec</span>'; return;
    }
    setSrv(u); busy(true,'جارٍ التحقّق…');
    try{
      st.settings=await db.settings();
      st.owner=await db.checkToken();
      applySettings();
      busy(false); closeSheet(); await refresh();
      toast('تم الاتصال بخادمك بنجاح');
    }catch(e){ busy(false); setSrv(''); $('#srvmsg').innerHTML='<span style="color:var(--danger)">'+esc(e.message)+'</span>'; }
  };
}

function fatal(msg){
  $('#view').innerHTML='';
  const b=el('div','empty','<div class="big">⚠</div><p>'+esc(msg)+'</p>');
  const r=el('button','btn ghost','إعادة المحاولة'); r.onclick=()=>location.reload();
  const c=el('button','btn ghost','تغيير رابط الخادم'); c.style.marginTop='8px'; c.onclick=()=>{setSrv('');serverSheet()};
  b.append(r,c); $('#view').appendChild(b);
}

async function refresh(){
  busy(true,'جارٍ التحميل…');
  try{
    st.meta=await db.meta();
    st.items=await db.list(st.owner);
    st.seriesNames=[...new Set(st.items.map(i=>i.series).filter(Boolean))];
    busy(false); renderChrome(); render();
  }catch(e){
    busy(false); renderChrome();
    // انقطاع الاتصال وعندنا بيانات محمَّلة: أبقِ ما هو معروض ولا تُفرغ الشاشة
    if(isNetworkError(e) && (st.items.length || st.queue.length)){ render(); toast('لا اتصال — تعرض آخر نسخة محمَّلة'); }
    else fatal(e.message);
  }
}

/* ---------- 6) الواجهة العامة ---------- */
function bindChrome(){
  $('#q').addEventListener('input',e=>{st.q=e.target.value;st.limit=20;$('#qclear').style.display=e.target.value?'block':'none';render()});
  $('#qclear').onclick=()=>{$('#q').value='';st.q='';$('#qclear').style.display='none';render()};
  $('#btnFilters').onclick=()=>$('#filters').classList.toggle('open');
  $('#btnTheme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('k_theme',d?'light':'dark')};
  $('#btnFont').onclick=()=>{const c=+(localStorage.getItem('k_fs')||16);const n=c>=20?15:c+1;localStorage.setItem('k_fs',n);document.documentElement.style.setProperty('--fs',n+'px')};
  $('#btnAuth').onclick=()=>st.owner?logout():loginSheet();
  $('#fab').onclick=()=>editor(null);
  $('#btnSession').onclick=()=>st.session?endSession():sessionSheet();
  $('#btnPrint').onclick=()=>printSheet();
  $('#btnHelp').onclick=()=>helpSheet();
  window.addEventListener('online',()=>flushQueue(true));
  $('#scrim').onclick=e=>{if(e.target===$('#scrim'))closeSheet()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
}

function renderChrome(){
  $('#modePill').textContent = st.owner?'المالك':'زائر';
  $('#modePill').className = 'modepill'+(st.owner?'':' guest');
  $('#btnAuth').textContent = st.owner?'⎋':'⌸';
  $('#btnAuth').title = st.owner?'خروج':'دخول';
  $('#fab').style.display = st.owner?'flex':'none';
  $('#btnSession').style.display = st.owner?'grid':'none';
  $('#btnSession').style.background = st.session?'var(--gold)':'';
  $('#btnSession').style.color = st.session?'#1d2b36':'';
  renderBanners();

  const tabs=[['all','الكل'],['star','المميزة'],['series','السلاسل'],['speakers','القائلون'],['refs','المراجع']];
  if(st.owner) tabs.splice(2,0,['due','للمراجعة'],['draft','تحتاج استكمال'],['private','الخاصة']);
  if(st.owner) tabs.push(['reading','سجل القراءة']);
  if(st.owner) tabs.push(['stats','إحصاءات'],['admin','لوحة التحكم'],['trash','سلة المحذوفات']);
  const n=$('#tabs'); n.innerHTML='';
  tabs.forEach(([k,l])=>{
    const b=el('button','tab'+(st.tab===k?' on':''),esc(l));
    b.onclick=()=>{st.tab=k;st.limit=20;renderChrome();render()};
    n.appendChild(b);
  });

  const f=$('#filters'); f.innerHTML='';
  const groups=[['cat','تصنيف',st.meta.categories],['speaker','قائل',st.meta.speakers],
                ['ref','مرجع',st.meta.refs],['type','نوع',st.meta.types],['tag','وسم',st.meta.tags]];
  groups.forEach(([k,label,vals])=>{
    if(!vals.length)return;
    const row=el('div','frow'); row.appendChild(el('span','flabel',esc(label)));
    const all=el('button','chip'+(st.f[k]?'':' on'),'الكل');
    all.onclick=()=>{st.f[k]='';renderChrome();render()}; row.appendChild(all);
    vals.slice(0,40).forEach(v=>{
      const c=el('button','chip'+(st.f[k]===v?' on':''),esc(v));
      c.onclick=()=>{st.f[k]=st.f[k]===v?'':v;st.limit=20;renderChrome();render()};
      row.appendChild(c);
    });
    f.appendChild(row);
  });
}

/* ---------- 7) التصفية والبحث ---------- */
function filtered(){
  let a=(st.owner?queuedAsItems():[]).concat(st.items);
  if(st.tab==='star') a=a.filter(i=>i.starred);
  if(st.tab==='draft') a=a.filter(i=>i.status==='مسودة');
  if(st.tab==='private') a=a.filter(i=>i.visibility==='خاصة');
  const f=st.f;
  if(f.cat) a=a.filter(i=>i.cat===f.cat);
  if(f.speaker) a=a.filter(i=>i.speaker===f.speaker);
  if(f.ref) a=a.filter(i=>i.ref===f.ref);
  if(f.type) a=a.filter(i=>i.type===f.type);
  if(f.tag) a=a.filter(i=>(i.tags||[]).includes(f.tag));
  const q=norm(st.q);
  if(q){ const w=q.split(' ').filter(Boolean);
    a=a.filter(i=>{ const hay=norm([i.title,i.text,i.speaker,i.ref,i.cat,i.note,(i.tags||[]).join(' ')].join(' '));
      return w.every(x=>hay.includes(x)); }); }
  return a;
}

/* ---------- 8) العرض ---------- */
function render(){
  const v=$('#view'); v.innerHTML='';
  $('#countline').innerHTML='';
  if(st.tab==='stats') return renderStats(v);
  if(st.tab==='trash') return renderTrash(v);
  if(st.tab==='admin') return renderAdmin(v);
  if(st.tab==='due') return renderDue(v);
  if(st.tab==='series') return renderSeries(v);
  if(st.tab==='reading') return renderReading(v);
  if(st.tab==='speakers') return renderIndex(v,'speaker','القائلون');
  if(st.tab==='refs') return renderIndex(v,'ref','المراجع');

  const a=filtered();
  $('#countline').innerHTML = `<span>النتائج: <b>${a.length}</b></span>` +
    (st.owner?`<span>· خاصة: ${a.filter(i=>i.visibility==='خاصة').length}</span><span>· مسودات: ${a.filter(i=>i.status==='مسودة').length}</span>`:'');
  if(!a.length){ v.appendChild(el('div','empty','<div class="big">✣</div><p>لا توجد فوائد مطابقة.</p>')); return; }

  if(!st.q && st.tab==='all' && !Object.values(st.f).some(Boolean) && a.length>3){
    const r=a[Math.floor(Math.random()*a.length)];
    const box=el('div','listsec','فائدة اليوم'); v.appendChild(box);
    v.appendChild(card(r,true));
    v.appendChild(el('div','listsec','كل الفوائد'));
  }
  const wrapEl=el('div','cards');
  a.slice(0,st.limit).forEach(i=>wrapEl.appendChild(card(i)));
  v.appendChild(wrapEl);
  if(a.length>st.limit){
    const b=el('button','btn ghost','عرض المزيد ('+(a.length-st.limit)+')');
    b.style.marginTop='14px'; b.onclick=()=>{st.limit+=20;render()}; v.appendChild(b);
  }
}

function card(i,featured){
  const c=el('div','card'+(i.visibility==='خاصة'?' private':'')+(i.status==='مسودة'?' draft':'')+(i._pending?' pending':''));
  const top=el('div','ctop');
  if(i.type) top.appendChild(el('span','badge',esc(i.type)));
  if(i.cat) top.appendChild(el('span','badge',esc(i.cat)));
  if(st.owner&&i.visibility==='خاصة') top.appendChild(el('span','badge priv','خاصة'));
  if(i.status==='مسودة') top.appendChild(el('span','badge draft','مسودة'));
  if(i._pending) top.appendChild(el('span','badge wait','⏳ بانتظار الإرسال'));
  if(i.series&&st.tab!=='series') top.appendChild(el('span','badge','⛓ '+esc(i.series)));
  const star=el('button','star'+(i.starred?' on':''),'★');
  star.onclick=async e=>{e.stopPropagation(); if(!st.owner)return; await db.setField(i.id,'starred',!i.starred); i.starred=!i.starred; render();};
  top.appendChild(star);
  c.appendChild(top);
  if(i.title) c.appendChild(el('h3','ctitle',esc(i.title)));
  c.appendChild(el('p','ctext',esc(i.text)));
  const cite=citation(i);
  if(cite) c.appendChild(el('div','cite',cite));
  if((i.tags||[]).length){
    const t=el('div','tags'); i.tags.forEach(x=>{
      const b=el('button','tag','#'+esc(x));
      b.onclick=e=>{e.stopPropagation();st.f.tag=x;st.limit=20;renderChrome();render();window.scrollTo({top:0,behavior:'smooth'})};
      t.appendChild(b)});
    c.appendChild(t);
  }
  const acts=el('div','cacts');
  if(i._pending){
    const rm=el('button','sbtn','حذف من الانتظار');
    rm.onclick=()=>{ st.queue=st.queue.filter(q=>q.tmp!==i.id); persistQueue(); render(); toast('حُذفت من قائمة الانتظار'); };
    acts.appendChild(rm); c.appendChild(acts); return c;
  }
  const open=el('button','sbtn','عرض'); open.onclick=()=>detail(i.id); acts.appendChild(open);
  const cp=el('button','sbtn','نسخ موثّق'); cp.onclick=()=>copyCited(i); acts.appendChild(cp);
  const sh=el('button','sbtn','مشاركة'); sh.onclick=()=>shareLink(i); acts.appendChild(sh);
  if(st.owner){
    const ed=el('button','sbtn','تعديل'); ed.onclick=()=>editor(i); acts.appendChild(ed);
    const vz=el('button','sbtn',i.visibility==='عامة'?'→ خاصة':'→ عامة');
    vz.onclick=async()=>{await db.setField(i.id,'visibility',i.visibility==='عامة'?'خاصة':'عامة');await refresh();toast('تم تغيير الظهور')};
    acts.appendChild(vz);
    const dl=el('button','sbtn','حذف');
    dl.onclick=async()=>{await db.remove(i.id);await refresh();toast('نُقلت إلى سلة المحذوفات','↶ تراجع',async()=>{await db.restore(i.id);await refresh()})};
    acts.appendChild(dl);
  }
  c.appendChild(acts);
  if(featured) c.classList.add('full');
  return c;
}

function citation(i){
  const p=[]; if(i.speaker)p.push('<b>'+esc(i.speaker)+'</b>');
  if(i.ref)p.push(esc(i.ref)+(i.locus?' ('+esc(i.locus)+')':''));
  if(i.via)p.push('نقلًا عن '+esc(i.via));
  if(!p.length) return st.owner&&i.status==='مسودة'?'<span style="color:var(--warn)">بلا توثيق — تحتاج استكمال</span>':'';
  return '— '+p.join('، ');
}
function citeText(i){
  const p=[]; if(i.speaker)p.push(i.speaker);
  if(i.ref)p.push(i.ref+(i.locus?' ('+i.locus+')':''));
  if(i.via)p.push('نقلًا عن '+i.via);
  return '«'+i.text+'»'+(p.length?'\n— '+p.join('، '):'');
}
function copyCited(i){
  const t=citeText(i);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('نُسخت الفائدة بتوثيقها'),()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('نُسخت الفائدة')}catch(e){toast('تعذّر النسخ')}a.remove();}

function renderIndex(v,field,label){
  const map={};
  st.items.forEach(i=>{const k=i[field]; if(k) map[k]=(map[k]||0)+1});
  const keys=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  if(!keys.length){v.appendChild(el('div','empty','<p>لا شيء بعد.</p>'));return}
  $('#countline').innerHTML=`<span>${esc(label)}: <b>${keys.length}</b></span>`;
  keys.forEach(k=>{
    const b=el('button','pbtn',`<span>${esc(k)}</span><small>${map[k]} فائدة</small>`);
    b.onclick=()=>{st.f[field]=k;st.tab='all';st.limit=20;renderChrome();render();window.scrollTo({top:0,behavior:'smooth'})};
    v.appendChild(b);
  });
}

async function renderTrash(v){
  const a=await db.trash(st.owner);
  $('#countline').innerHTML=`<span>المحذوفة: <b>${a.length}</b></span>`;
  if(!a.length){v.appendChild(el('div','empty','<div class="big">🗑</div><p>السلة فارغة.</p>'));return}
  const em=el('button','btn danger','إفراغ السلة نهائيًّا ('+a.length+')'); em.style.marginBottom='12px';
  em.onclick=async()=>{ if(!confirm('حذف نهائي لكل ما في السلة. متأكد؟'))return;
    busy(true,'جارٍ الحذف…'); try{ const r=await db.emptyTrash(); busy(false); await refresh(); toast('حُذفت '+r.count+' فائدة'); }
    catch(e){ busy(false); toast(e.message); } };
  v.appendChild(em);
  const w=el('div','cards');
  a.forEach(i=>{
    const c=el('div','card');
    c.appendChild(el('p','ctext',esc(i.text)));
    const acts=el('div','cacts');
    const r=el('button','sbtn','استعادة'); r.onclick=async()=>{await db.restore(i.id);await refresh();toast('استُعيدت الفائدة')};
    const p=el('button','sbtn','حذف نهائي'); p.style.color='var(--danger)';
    p.onclick=async()=>{if(confirm('حذف نهائي لا رجعة فيه. متأكد؟')){await db.purge(i.id);await refresh();toast('حُذفت نهائيًا')}};
    acts.append(r,p); c.appendChild(acts); w.appendChild(c);
  });
  v.appendChild(w);
}

function renderStats(v){
  const a=st.items;
  const S=[['إجمالي الفوائد',a.length],['عامة',a.filter(i=>i.visibility==='عامة').length],
           ['خاصة',a.filter(i=>i.visibility==='خاصة').length],['مسودات',a.filter(i=>i.status==='مسودة').length],
           ['مميّزة',a.filter(i=>i.starred).length]];
  const g=el('div','stats');
  S.forEach(([l,n])=>g.appendChild(el('div','stat',`<div class="n">${n}</div><div class="l">${esc(l)}</div>`)));
  v.appendChild(g);
  const tops=(field,title)=>{
    const m={}; a.forEach(i=>{const k=i[field];if(k)m[k]=(m[k]||0)+1});
    const ks=Object.keys(m).sort((x,y)=>m[y]-m[x]).slice(0,7);
    if(!ks.length)return;
    const max=m[ks[0]]||1;
    const b=el('div','bars',`<h4>${esc(title)}</h4>`);
    ks.forEach(k=>b.appendChild(el('div','bar',
      `<span class="nm">${esc(k)}</span><span class="tr"><span class="fl" style="width:${Math.round(m[k]/max*100)}%"></span></span><span class="vl">${m[k]}</span>`)));
    v.appendChild(b);
  };
  tops('cat','أكثر التصنيفات'); tops('speaker','أكثر القائلين'); tops('ref','أكثر المراجع');
  const ex=el('button','btn ghost','تصدير نسخة احتياطية (JSON)');
  ex.onclick=async()=>{const d=await db.exportAll();const u=URL.createObjectURL(new Blob([d],{type:'application/json'}));
    const a2=document.createElement('a');a2.href=u;a2.download='كناشة-نسخة-احتياطية.json';a2.click();URL.revokeObjectURL(u)};
  v.appendChild(ex);
  const ch=el('button','btn ghost','تغيير رابط الخادم'); ch.style.marginTop='8px';
  ch.onclick=()=>{ if(confirm('سيُطلب منك رابط الخادم من جديد في هذا الجهاز. متابعة؟')){ setSrv(''); location.reload(); } };
  v.appendChild(ch);
}

/* ---------- 9) الأوراق (sheets) ---------- */
function openSheet(html){ $('#sheet').innerHTML=html; $('#scrim').classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(){ $('#scrim').classList.remove('open'); document.body.style.overflow='';
  if((location.hash||'').indexOf('#/f/')===0){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } }

async function detail(id, fromHash){
  let i;
  busy(true,'جارٍ الفتح…');
  try{ i=await db.get(id,st.owner); }catch(e){ busy(false); toast(e.message); return; }
  busy(false);
  if(!i){ if(fromHash) toast('هذه الفائدة غير موجودة أو ليست عامة'); return; }
  if(!fromHash){ try{ history.replaceState(null,'','#/f/'+id); }catch(e){} }
  openSheet(`<div class="shhd"><h3>${esc(i.title||'فائدة')}</h3><div class="sp"></div>
      <button class="iconbtn" style="background:var(--gold-soft);color:var(--ink)" id="x">✕</button></div>
    <div class="dtext">${esc(i.text)}</div>
    <div class="meta">
      ${i.type?`<div><b>النوع:</b>${esc(i.type)}</div>`:''}
      ${i.speaker?`<div><b>القائل:</b>${esc(i.speaker)}</div>`:''}
      ${i.ref?`<div><b>المرجع:</b>${esc(i.ref)}${i.locus?' — '+esc(i.locus):''}</div>`:''}
      ${i.via?`<div><b>الوسيط:</b>${esc(i.via)}</div>`:''}
      ${i.link?`<div><b>الرابط:</b><a href="${esc(i.link)}" target="_blank" rel="noopener">فتح</a></div>`:''}
      ${i.cat?`<div><b>التصنيف:</b>${esc(i.cat)}</div>`:''}
      ${i.anchor?`<div><b>الموضع:</b>${esc(i.anchor)}</div>`:''}
      ${i.series?`<div><b>السلسلة:</b>${esc(i.series)}${i.sorder?' ('+i.sorder+')':''}</div>`:''}
      ${(i.tags||[]).length?`<div><b>الوسوم:</b>${i.tags.map(t=>'#'+esc(t)).join('، ')}</div>`:''}
      ${st.owner&&i.note?`<div><b>تعليقي:</b>${esc(i.note)}</div>`:''}
      <div><b>أُضيفت:</b>${esc(hijri(i.createdAt))} هـ — ${esc(greg(i.createdAt))} م</div>
      <div><b>المعرّف:</b>${esc(i.id)}</div>
    </div>
    <div class="quote" id="qt">${esc(citeText(i))}</div>
    <div class="row2" style="margin-top:14px">
      <button class="btn ghost" id="cp">نسخ موثّق</button>
      <button class="btn ghost" id="lk">نسخ الرابط</button>
    </div>
    <div class="row2" style="margin-top:8px">
      <button class="btn ghost" id="wa">واتساب</button>
      <button class="btn ghost" id="img">بطاقة صورة</button>
    </div>
    ${st.owner?'<button class="btn" id="ed" style="margin-top:8px">تعديل</button>':''}`);
  $('#x').onclick=closeSheet; $('#cp').onclick=()=>copyCited(i);
  $('#lk').onclick=()=>shareLink(i);
  $('#wa').onclick=()=>shareWhatsApp(i);
  $('#img').onclick=async()=>{ busy(true,'جارٍ تجهيز البطاقة…'); try{ await quoteCard(i, navigator.canShare?'share':'save'); }catch(e){ toast('تعذّر إنشاء البطاقة'); } busy(false); };
  if($('#ed')) $('#ed').onclick=()=>editor(i);
}

const DRAFT='k_draft';
function editor(item){
  const m=st.meta, isNew=!item;
  const S=st.session||{};
  const i=item||{text:'',title:'',type:'فائدة',speaker:S.speaker||last('speaker'),ref:S.ref||last('ref'),locus:'',
                 via:'',link:'',cat:S.cat||last('cat')||m.categories[0],tags:[],note:'',
                 visibility:st.settings.defaultVisibility,starred:false,status:'منشورة'};
  const dl=(id,arr)=>`<datalist id="${id}">${arr.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
  openSheet(`<div class="shhd"><h3>${isNew?'فائدة جديدة':'تعديل الفائدة'}</h3><div class="sp"></div>
      <button class="iconbtn" style="background:var(--gold-soft);color:var(--ink)" id="x">✕</button></div>
    <label class="fld"><span>نص الفائدة (وحده يكفي للحفظ)</span>

      type:$('#f_type').value, note:$('#f_note').value.trim(),
      tags:[...new Set(tags.concat(p.tags))],
      visibility:$('#f_vis').value, starred:$('#f_star').value==='1'||p.star };
    obj.status = (obj.speaker||obj.ref) ? 'منشورة' : 'مسودة';
    // منع التكرار
    const dup=st.items.find(x=>x.id!==obj.id && norm(x.text).slice(0,60)===norm(obj.text).slice(0,60));
    if(dup && !confirm('هذه الفائدة تشبه فائدة دوّنتها سابقًا بتاريخ '+hijri(dup.createdAt)+'. أحفظها على أي حال؟')) return;
    busy(true,'جارٍ الحفظ…');
    let r;
    try{ r=await saveItem(obj); }
    catch(e){ busy(false); toast(e.message); return; }
    remember(obj); try{localStorage.removeItem(DRAFT)}catch(e){}
    if(isNew && st.session){ st.session.n=(st.session.n||0)+1; saveSession(st.session); }
    busy(false); closeSheet(); await refresh();
    if(r.queued){
      toast('لا اتصال — حُفظت في جهازك وستُرسل تلقائيًّا','↶ تراجع',
        ()=>{ st.queue=st.queue.filter(q=>q.tmp!==r.id); persistQueue(); render(); });
    }else{
      toast(obj.status==='مسودة'?'حُفظت مسودة (تحتاج توثيقًا)':'تم الحفظ','↶ تراجع',
        async()=>{ if(isNew){ try{await db.remove(r.id)}catch(e){} } await refresh(); });
    }
  };
}
function autoTitle(t){ const s=t.replace(/\s+/g,' ').trim(); return s.length<=40?s:s.slice(0,40)+'…'; }
function parseShortcuts(t){
  const out={tags:[],cat:'',speaker:'',ref:'',locus:'',via:'',star:false};
  t=t.replace(/\[([^\]\[]+?)\s+([\d٠-٩]+\/[\d٠-٩]+|ص\s*[\d٠-٩]+|د\s*[\d:٠-٩]+)\]/g,(m,a,b)=>{out.ref=a.trim();out.locus=b.trim();return ''});
  t=t.replace(/\[([^\]\[]{2,60})\]/g,(m,a)=>{if(!out.ref)out.ref=a.trim();return ''});
  t=t.replace(/(^|\s)@([^\s@#~]+)/g,(m,s,a)=>{if(!out.speaker)out.speaker=a.replace(/_/g,' ');return s});
  t=t.replace(/(^|\s)~([^\s@#~]+)/g,(m,s,a)=>{if(!out.via)out.via=a.replace(/_/g,' ');return s});
  t=t.replace(/(^|\s)#([^\s#@~]+)/g,(m,s,a)=>{const v=a.replace(/_/g,' ');if(!out.cat)out.cat=v;else out.tags.push(v);return s});
  t=t.replace(/(^|\s)!(\s|$)/g,(m,s)=>{out.star=true;return s});
  out.text=t.replace(/\s+\n/g,'\n').replace(/[ \t]{2,}/g,' ').trim();
  return out;
}
function remember(o){ try{localStorage.setItem('k_last',JSON.stringify({speaker:o.speaker,ref:o.ref,cat:o.cat}))}catch(e){} }
function last(k){ try{return (JSON.parse(localStorage.getItem('k_last'))||{})[k]||''}catch(e){return ''} }
function restoreDraftNotice(){
  let d=''; try{d=localStorage.getItem(DRAFT)||''}catch(e){}
  if(d.trim()&&st.owner) toast('لديك مسودة غير محفوظة','استعادتها',()=>{editor(null);setTimeout(()=>{$('#f_text').value=d},50)});
}

const SESKEY='k_session', QKEY='k_queue';

/* ===== جلسة القراءة ===== */
function loadSession(){ try{ st.session=JSON.parse(localStorage.getItem(SESKEY))||null }catch(e){ st.session=null } }
function saveSession(s){ st.session=s; try{ s?localStorage.setItem(SESKEY,JSON.stringify(s)):localStorage.removeItem(SESKEY) }catch(e){} }

function sessionSheet(){

  const b=$('#banners'); if(!b) return; b.innerHTML='';

  }

    const d=el('div','banner',`<span>⏳</span><span><b>${st.queue.length}</b> فائدة بانتظار الإرسال</span>`);
    const sp=el('span','sp'); const btn=el('button',null,'إرسال الآن');
    btn.onclick=()=>flushQueue(true); d.append(sp,btn); b.appendChild(d);

/* ===== قائمة الانتظار عند انقطاع الاتصال ===== */
function loadQueue(){ try{ st.queue=JSON.parse(localStorage.getItem(QKEY))||[] }catch(e){ st.queue=[] } }
function persistQueue(){ try{ localStorage.setItem(QKEY,JSON.stringify(st.queue)) }catch(e){} }

function isNetworkError(e){
  const m=String(e&&e.message||'');
  return m.indexOf('تعذّر الاتصال')>=0 || m.indexOf('رد غير متوقّع')>=0 || !navigator.onLine;
}

/** الحفظ الآمن: يحاول الإرسال، فإن تعذّر حفظ في الجهاز وأرسل تلقائيًّا عند عودة الاتصال. */
async function saveItem(obj){
  try{
    const id=await db.save(obj);
    return {id, queued:false};
  }catch(e){
    if(!isNetworkError(e) || obj.id) throw e;   // التعديل لا يُصفّ، لئلا يتعارض
    const tmp='Q-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
    st.queue.push({tmp, obj, at:new Date().toISOString()});
    persistQueue();
    return {id:tmp, queued:true};
  }
}

let flushing=false;
async function flushQueue(loud){
  if(flushing || !st.queue.length) { if(loud&&!st.queue.length) toast('لا شيء في الانتظار'); return; }
  if(!srv() || !st.owner) return;
  flushing=true;
  let sent=0, stop=false;
  while(st.queue.length && !stop){
    const item=st.queue[0];
    try{ await db.save(item.obj); st.queue.shift(); persistQueue(); sent++; }
    catch(e){ stop=true; if(loud) toast(isNetworkError(e)?'ما زال الاتصال متعذّرًا':e.message); }
  }
  flushing=false;
  if(sent){ toast('أُرسلت '+sent+' فائدة كانت في الانتظار'); await refresh(); }
  else renderBanners();
}

/** بطاقات قائمة الانتظار تُعرض مع الفوائد حتى لا يظنّها صاحبها ضائعة. */
function queuedAsItems(){
  return st.queue.map(q=>Object.assign({},q.obj,{
    id:q.tmp, createdAt:q.at, updatedAt:q.at, _pending:true, status:q.obj.status||'منشورة'
  }));
}

/* ===== رابط ثابت لكل فائدة ===== */
function permalink(id){ return location.origin + location.pathname + '#/f/' + id; }

function handleHash(){
  const m = (location.hash||'').match(/^#\/f\/([\w-]+)/);
  if(m) detail(m[1], true);
}
window.addEventListener('hashchange',handleHash);

function shareLink(i){
  const url = permalink(i.id);
  if(navigator.share){
    navigator.share({title:(st.settings&&st.settings.name)||'فائدة', text:citeText(i), url}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>toast('نُسخ رابط الفائدة'),()=>fallbackCopy(url));
  }else fallbackCopy(url);
}

function shareWhatsApp(i){
  const t = citeText(i) + '\n' + permalink(i.id);
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

/* ===== بطاقة اقتباس مصمَّمة (صورة) ===== */
async function quoteCard(i, action){
  const W=1080, H=1080, pad=96;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  try{ await document.fonts.ready; }catch(e){}

  // خلفية ورقية دافئة + إطار ذهبي
  x.fillStyle='#f6f1e6'; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(176,141,87,.10)';
  for(let a=24;a<W;a+=34) for(let b=24;b<H;b+=34){ x.beginPath(); x.arc(a,b,1.6,0,6.3); x.fill(); }
  x.strokeStyle='#b08d57'; x.lineWidth=3; x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle='rgba(20,50,63,.25)'; x.lineWidth=1; x.strokeRect(54,54,W-108,H-108);

  x.direction='rtl'; x.textAlign='right';

  // النص
  const text=(i.text||'').trim();
  let size = text.length>420?34 : text.length>260?40 : text.length>140?48 : 56;
  let lines=[], lh=0;
  for(;;){
    x.font='400 '+size+'px Amiri, serif'; lh=Math.round(size*1.85);
    lines=wrapText(x, text, W-pad*2);
    if(lines.length*lh <= H-pad*2-220 || size<=24) break;
    size-=3;
  }
  // علامات تنصيص
  x.fillStyle='rgba(176,141,87,.35)'; x.font='700 150px Amiri, serif';
  x.fillText('”', W-pad+6, pad+120);

  const blockH=lines.length*lh;
  let y=Math.max(pad+170, (H-60-blockH)/2 + lh);
  x.fillStyle='#14323f';
  x.font='400 '+size+'px Amiri, serif';
  lines.forEach(L=>{ x.fillText(L, W-pad, y); y+=lh; });

  // خط فاصل والتوثيق
  const cite=[i.speaker, i.ref?(i.ref+(i.locus?' ('+i.locus+')':'')):'' , i.via?('نقلًا عن '+i.via):''].filter(Boolean).join('، ');
  const baseY=H-pad-30;
  x.strokeStyle='#b08d57'; x.lineWidth=2;
  x.beginPath(); x.moveTo(W-pad, baseY-64); x.lineTo(W-pad-260, baseY-64); x.stroke();
  if(cite){
    x.fillStyle='#4a5d68'; x.font='600 30px Cairo, sans-serif';
    const cl=wrapText(x, '— '+cite, W-pad*2);
    let cy=baseY-18; cl.slice(0,2).forEach(L=>{ x.fillText(L, W-pad, cy); cy+=40; });
  }
  // توقيع المنصة
  x.textAlign='left'; x.fillStyle='rgba(20,50,63,.45)'; x.font='700 26px Cairo, sans-serif';
  x.fillText((st.settings&&st.settings.name)||'كُنّاشة الفوائد', pad, baseY+10);

  const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
  const name = 'فائدة-'+i.id+'.png';
  if(action==='share' && navigator.canShare){
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], text:citeText(i)}); return; }catch(e){ return; }
    }
  }
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast('حُفظت بطاقة الاقتباس صورةً');
}

function wrapText(ctx, text, maxW){
  const out=[];
  (text||'').split('\n').forEach(para=>{
    const words=para.split(/\s+/).filter(Boolean);
    let line='';
    words.forEach(w=>{
      const t = line ? line+' '+w : w;
      if(ctx.measureText(t).width > maxW && line){ out.push(line); line=w; }
      else line=t;
    });
    if(line) out.push(line);
    if(!words.length) out.push('');
  });
  return out;
}

/* ---------- 9هـ) المراجعة والسلاسل وسجل القراءة (المرحلة 7) ---------- */

/* ===== المراجعة المتباعدة ===== */
async function renderDue(v){
  $('#countline').innerHTML='';
  v.innerHTML='<div class="empty">جارٍ التحميل…</div>';
  let a;
  try{ a=await db.due(); }catch(e){ v.innerHTML=''; return fatal(e.message); }
  v.innerHTML='';
  if(!a.length){
    v.appendChild(el('div','empty',
      '<div class="big">✧</div><p>لا فائدة مستحقّة للمراجعة اليوم.</p>'+
      '<p class="hint">تدخل الفائدة في المراجعة بتمييزها بنجمة ★، ثم تعود إليك على فترات متباعدة حتى ترسخ.</p>'));
    return;
  }
  $('#countline').innerHTML=`<span>للمراجعة اليوم: <b>${a.length}</b></span>`;
  const w=el('div','cards');
  a.forEach(i=>{
    const c=card(i); c.classList.add('full');
    const acts=c.querySelector('.cacts');
    const bar=el('div','cacts'); bar.style.cssText='border-top:1px dashed var(--line);padding-top:8px;margin-top:8px';
    const mk=(label,grade,hint)=>{
      const b=el('button','sbtn',label); b.title=hint||'';
      b.onclick=async()=>{
        busy(true,'جارٍ التسجيل…');
        try{ const r=await db.review(i.id,grade); busy(false);
          toast(grade==='stop'?'أُخرجت من المراجعة':('أحسنت — تعود بعد '+r.days+' يومًا'));
          renderDue($('#view'));
        }catch(e){ busy(false); toast(e.message); }
      };
      return b;
    };
    bar.append(mk('✓ تذكّرتها','ok','تتباعد المدة'), mk('↻ راجعها غدًا','again','تعود من البداية'), mk('إيقاف مراجعتها','stop'));
    (acts||c).parentNode.insertBefore(bar, acts?acts.nextSibling:null);
    w.appendChild(c);
  });
  v.appendChild(w);
}

/* ===== السلاسل والكرّاسات ===== */
async function renderSeries(v){
  $('#countline').innerHTML='';
  v.innerHTML='<div class="empty">جارٍ التحميل…</div>';
  let a;
  try{ a=await db.series(); }catch(e){ v.innerHTML=''; return fatal(e.message); }
  v.innerHTML='';
  if(!a.length){
    v.appendChild(el('div','empty','<div class="big">⛓</div><p>لا سلاسل بعد.</p>'+
      '<p class="hint">السلسلة تجمع فوائد في موضوع واحد مرتَّبة (مثل: «فوائد في أبواب الطهارة»). اكتب اسمها في حقل «السلسلة» عند تدوين الفائدة.</p>'));
    return;
  }
  $('#countline').innerHTML=`<span>السلاسل: <b>${a.length}</b></span>`;
  a.forEach(s=>{
    v.appendChild(el('div','listsec',esc(s.name)+' <span style="color:var(--muted);font-size:.8rem">('+s.count+')</span>'));
    const w=el('div','cards');
    s.items.forEach((i,n)=>{
      const c=card(i);
      const b=el('span','badge',(n+1)+' من '+s.count);
      c.querySelector('.ctop').insertBefore(b, c.querySelector('.ctop').firstChild);
      w.appendChild(c);
    });
    v.appendChild(w);
  });
}

/* ===== سجل القراءة ===== */
async function renderReading(v){
  $('#countline').innerHTML='';
  v.innerHTML='<div class="empty">جارٍ التحميل…</div>';
  let a;
  try{ a=await db.reading(); }catch(e){ v.innerHTML=''; return fatal(e.message); }
  v.innerHTML='';
  if(!a.length){ v.appendChild(el('div','empty','<div class="big">📖</div><p>لم تُدوّن فائدة بمرجع بعد.</p>')); return; }
  $('#countline').innerHTML=`<span>الكتب والدروس: <b>${a.length}</b></span>`;
  const max=a[0].count||1;
  a.forEach(r=>{
    const box=el('div','bars');
    box.appendChild(el('h4',null,esc(r.ref)));
    if(r.speakers&&r.speakers.length) box.appendChild(el('p','hint',esc(r.speakers.join('، '))));
    box.appendChild(el('div','bar',
      `<span class="nm">فوائد</span><span class="tr"><span class="fl" style="width:${Math.round(r.count/max*100)}%"></span></span><span class="vl">${r.count}</span>`));
    const span=el('p','hint',
      'من '+esc(hijri(r.first))+' إلى '+esc(hijri(r.last)));
    box.appendChild(span);
    const go=el('button','sbtn','عرض فوائده');
    go.onclick=()=>{ st.f={cat:'',speaker:'',ref:r.ref,type:'',tag:''}; st.tab='all'; st.limit=20;
      renderChrome(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
    box.appendChild(go);
    v.appendChild(box);
  });
}

/* ===== صفحة المساعدة ===== */
function helpSheet(){
  openSheet(`<div class="shhd"><h3>دليل الكُنّاشة</h3><div class="sp"></div>
      <button class="iconbtn" style="background:var(--gold-soft);color:var(--ink)" id="x">✕</button></div>

      <p><b>التدوين في ثوانٍ.</b> اضغط <b>＋ فائدة</b> واكتب النص واحفظ. النص وحده يكفي، وما نقص من توثيق تُعلَّم الفائدة به «مسودة» وتجدها في تبويب «تحتاج استكمال» لتُتمّها متى شئت.</p>
      <p><b>اختصارات داخل النص</b> تملأ الحقول عنك:<br>
         <code>#الفقه</code> تصنيف · <code>#طهارة</code> وسم · <code>@ابن_تيمية</code> قائل ·
         <code>[زاد المعاد 2/45]</code> مرجع وموضع · <code>~ابن القيم</code> وسيط · <code>!</code> تمييز بنجمة.</p>
      <p><b>📖 جلسة القراءة.</b> إن كنت تقرأ في كتاب واحد، ابدأ جلسةً به مرة واحدة، فيُملأ المرجع والقائل في كل فائدة تاليةٍ ولا يبقى إلا النص والصفحة.</p>
      <p><b>بلا إنترنت.</b> دوّن كما تشاء؛ تُحفظ في جهازك بعلامة «⏳ بانتظار الإرسال» وتُرسَل وحدها فور عودة الاتصال.</p>
      <p><b>الخاص والعام.</b> الفائدة الجديدة <b>خاصة</b> ما لم تجعلها عامة. والزائر لا يرى الخاصة ولا المسودات ولا تعليقك — والتصفية تقع في الخادم لا في الصفحة، فلا سبيل إليها.</p>
      <p><b>البحث</b> يتسامح مع التشكيل والهمزات والتاء المربوطة، فـ«الحديبيه» تجد «الحُديبية».</p>
      <p><b>★ المراجعة.</b> ما تُميّزه بنجمة يدخل في المراجعة المتباعدة: يعود إليك بعد يوم، ثم ثلاثة، ثم أسبوع، وهكذا حتى يرسخ. وتجده في تبويب «للمراجعة».</p>
      <p><b>⛓ السلاسل.</b> اكتب اسمًا واحدًا في حقل «السلسلة» لعدة فوائد، تجتمع مرتَّبة في تبويب «السلاسل» — ككرّاسة في موضوع.</p>
      <p><b>المشاركة.</b> من بطاقة الفائدة: نسخ بتوثيقها، أو رابط ثابت، أو واتساب، أو <b>بطاقة صورة</b> مصمَّمة.</p>
      <p><b>🖨 كُنّاشة مطبوعة.</b> تختار بابًا أو كتابًا فيخرج ملف منسَّق بفهرس، تطبعه أو تحفظه PDF.</p>

      <p><b>لا ضياع.</b> لا حذف نهائي إلا بأمرك: المحذوف يذهب إلى سلة تُستعاد منها.</p>
      <p class="hint" style="margin-top:14px">«قيّدوا العلمَ بالكتاب».</p>
    </div>`);

/* ---------- 10) الدخول ---------- */
function loginSheet(){
  openSheet(`<div class="shhd"><h3>دخول المالك</h3><div class="sp"></div>
     <button class="iconbtn" style="background:var(--gold-soft);color:var(--ink)" id="x">✕</button></div>
    <label class="fld"><span>كلمة المرور</span><input class="t" type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn" id="go">دخول</button>
    <p class="hint" style="margin-top:10px">كلمة المرور التي ضبطتها في الخادم. تُحفظ جلسةٌ في هذا الجهاز فلا تُسأل عنها مرة أخرى.</p>
    <p class="hint" id="lgmsg"></p>`);
  $('#x').onclick=closeSheet;
  const go=async()=>{
    busy(true,'جارٍ التحقّق…');
    let ok=false, err='';
    try{ ok=await db.login($('#pw').value); }catch(e){ err=e.message; }
    busy(false);
    if(err){ $('#lgmsg').innerHTML='<span style="color:var(--danger)">'+esc(err)+'</span>'; return; }
    if(!ok){ $('#lgmsg').innerHTML='<span style="color:var(--danger)">كلمة المرور غير صحيحة</span>'; return; }
    st.owner=true; closeSheet(); st.tab='all'; await refresh(); toast('أهلًا بك، دخلتَ بوضع المالك');
  };
  $('#go').onclick=go; $('#pw').onkeydown=e=>{if(e.key==='Enter')go()}; $('#pw').focus();
}
async function logout(){
  busy(true,'جارٍ الخروج…'); await db.logout(); busy(false);
  st.owner=false; st.tab='all'; st.f={cat:'',speaker:'',ref:'',type:'',tag:''}; saveSession(null);
  await refresh(); toast('خرجتَ — أنت الآن ترى ما يراه الزائر');
}
